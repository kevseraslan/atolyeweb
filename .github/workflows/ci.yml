name: CI Release Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: furniture_workshop_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Migration Test
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/furniture_workshop_test
          AUTH_SECRET: test_secret_key_minimum_32_characters_for_ci_build
        run: |
          cd backend
          alembic upgrade head
          alembic current

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/furniture_workshop_test
          AUTH_SECRET: test_secret_key_minimum_32_characters_for_ci_build
        run: |
          cd backend
          pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Lint
        run: |
          cd frontend
          npm run lint

      - name: Build Next.js Application
        run: |
          cd frontend
          npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: furniture_workshop_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/furniture_workshop_test
          AUTH_SECRET: test_secret_key_minimum_32_characters_for_ci_build
        run: |
          cd backend
          alembic upgrade head

      - name: Install Frontend Dependencies & Playwright Browsers
        run: |
          cd frontend
          npm ci
          npx playwright install chromium --with-deps

      - name: Build Next.js Production Bundle
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
          NEXT_PUBLIC_SITE_INDEXABLE: "false"
        run: |
          cd frontend
          npm run build

      - name: Run E2E Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/furniture_workshop_test
          AUTH_SECRET: test_secret_key_minimum_32_characters_for_ci_build
          APP_ENV: test
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
          NEXT_PUBLIC_SITE_INDEXABLE: "false"
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:3000
        run: |
          cd backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &

          cd ../frontend
          npm run start -- -p 3000 &

          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/api/v1/health | grep -q "ok" && curl -s http://127.0.0.1:3000 > /dev/null 2>&1; then
              echo "Both servers are ready!"
              break
            fi
            echo "Waiting for servers..."
            sleep 1
          done

          npm run test:e2e

      - name: Upload Playwright Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

