<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <!-- Warm workshop gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf9"/>
      <stop offset="50%" stop-color="#f6f2ef"/>
      <stop offset="100%" stop-color="#ebe4de"/>
    </linearGradient>
    <linearGradient id="woodDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b221a"/>
      <stop offset="50%" stop-color="#4a2d24"/>
      <stop offset="100%" stop-color="#3b221a"/>
    </linearGradient>
    <linearGradient id="woodWarm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8a5340"/>
      <stop offset="100%" stop-color="#693b2c"/>
    </linearGradient>
    <linearGradient id="woodLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbb3a3"/>
      <stop offset="100%" stop-color="#b09684"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a373"/>
      <stop offset="100%" stop-color="#b07d4b"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#442a22" flood-opacity="0.12"/>
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Atelier Canvas -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Architectural workshop grid & blueprint accents -->
  <g opacity="0.15" stroke="#442a22" stroke-width="1" stroke-dasharray="4 8">
    <line x1="100" y1="80" x2="1100" y2="80" />
    <line x1="100" y1="240" x2="1100" y2="240" />
    <line x1="100" y1="560" x2="1100" y2="560" />
    <line x1="100" y1="720" x2="1100" y2="720" />
    <line x1="200" y1="50" x2="200" y2="750" />
    <line x1="600" y1="50" x2="600" y2="750" />
    <line x1="1000" y1="50" x2="1000" y2="750" />
  </g>

  <!-- Sunbeam & workshop window atmosphere -->
  <path d="M700 0 L1050 0 L1200 450 L1200 800 L850 800 Z" fill="#ffffff" opacity="0.35"/>
  <path d="M850 0 L1150 0 L1200 250 L1200 650 Z" fill="#ffffff" opacity="0.25"/>

  <!-- Floating Atelier Geometric Accents & Design Lines -->
  <circle cx="950" cy="220" r="140" fill="none" stroke="#d4c3be" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="950" cy="220" r="100" fill="none" stroke="#e5e2e1" stroke-width="1"/>
  
  <!-- Backdrop Wood Panels / Stacked Timber -->
  <g filter="url(#softShadow)">
    <rect x="780" y="240" width="340" height="24" rx="4" fill="#a47864" opacity="0.8"/>
    <rect x="800" y="270" width="300" height="24" rx="4" fill="#8c5e4a" opacity="0.85"/>
    <rect x="760" y="300" width="360" height="24" rx="4" fill="#754735" opacity="0.9"/>
  </g>

  <!-- Bespoke Crafted Dining Table Scene (Hero Subject) -->
  <g filter="url(#softShadow)">
    <!-- Floor Shadow -->
    <ellipse cx="620" cy="670" rx="380" ry="24" fill="#442a22" opacity="0.16"/>

    <!-- Table Back Legs -->
    <polygon points="380,480 400,480 415,640 395,640" fill="#3b221a"/>
    <polygon points="840,480 860,480 875,640 855,640" fill="#3b221a"/>

    <!-- Table Main Legs Front (Tapered artisanal joinery) -->
    <polygon points="310,480 340,480 325,660 295,660" fill="url(#woodWarm)"/>
    <polygon points="910,480 940,480 955,660 925,660" fill="url(#woodWarm)"/>

    <!-- Solid Oak Tabletop (Perspective Angled Slab) -->
    <!-- Under bevel -->
    <polygon points="240,465 980,465 1020,490 200,490" fill="#2d1711"/>
    <!-- Front Chamfer Edge -->
    <polygon points="200,490 1020,490 1010,505 190,505" fill="url(#woodDark)"/>
    <!-- Top Face with Wood Grain -->
    <polygon points="250,440 970,440 1020,490 200,490" fill="url(#woodWarm)"/>
    
    <!-- Table Grain Lines -->
    <path d="M 280,455 Q 600,470 950,455" stroke="#a36955" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 230,475 Q 620,485 990,475" stroke="#5a2f23" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M 320,448 Q 650,460 900,448" stroke="#a36955" stroke-width="1" fill="none" opacity="0.4"/>
  </g>

  <!-- Crafted Chair 1 (Left Artisanal Spindle Chair) -->
  <g filter="url(#softShadow)">
    <ellipse cx="220" cy="650" rx="90" ry="12" fill="#442a22" opacity="0.12"/>
    <!-- Back legs -->
    <line x1="160" y1="400" x2="140" y2="640" stroke="#3b221a" stroke-width="8" stroke-linecap="round"/>
    <line x1="260" y1="400" x2="280" y2="640" stroke="#3b221a" stroke-width="8" stroke-linecap="round"/>
    <!-- Seat -->
    <path d="M 140,510 Q 210,500 280,510 L 270,530 Q 210,520 150,530 Z" fill="url(#woodWarm)"/>
    <!-- Curved Backrest Crest Rail -->
    <path d="M 150,380 Q 210,355 270,380 Q 210,365 150,380 Z" fill="url(#woodDark)"/>
    <!-- Spindles -->
    <line x1="180" y1="375" x2="175" y2="510" stroke="#693b2c" stroke-width="4"/>
    <line x1="210" y1="368" x2="210" y2="505" stroke="#693b2c" stroke-width="4"/>
    <line x1="240" y1="375" x2="245" y2="510" stroke="#693b2c" stroke-width="4"/>
    <!-- Front legs -->
    <line x1="150" y1="525" x2="160" y2="650" stroke="url(#woodWarm)" stroke-width="8" stroke-linecap="round"/>
    <line x1="270" y1="525" x2="260" y2="650" stroke="url(#woodWarm)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Modern Ceramic Vase & Botanical Branch on Table -->
  <g filter="url(#softShadow)">
    <!-- Vase -->
    <path d="M 680,440 Q 660,390 675,370 L 685,370 Q 700,390 680,440 Z" fill="#e8e2dc"/>
    <ellipse cx="680" cy="370" rx="5" ry="2" fill="#504441"/>
    <!-- Olive/Eucalyptus branch -->
    <path d="M 680,370 Q 690,310 660,260" stroke="#556b2f" stroke-width="2" fill="none"/>
    <ellipse cx="665" cy="290" rx="10" ry="5" transform="rotate(-30 665 290)" fill="#6b8e23" opacity="0.9"/>
    <ellipse cx="685" cy="320" rx="10" ry="5" transform="rotate(25 685 320)" fill="#6b8e23" opacity="0.9"/>
    <ellipse cx="660" cy="260" rx="8" ry="4" transform="rotate(-45 660 260)" fill="#7c9d32" opacity="0.9"/>
  </g>

  <!-- Craftsman Hand Tool Vignette (Bottom Right: Chisel & Brass Caliper) -->
  <g transform="translate(980, 580)" opacity="0.85">
    <!-- Brass Ruler -->
    <rect x="-40" y="40" width="140" height="18" rx="2" transform="rotate(-15)" fill="url(#goldAccent)"/>
    <!-- Wooden Hand Chisel -->
    <rect x="-10" y="-10" width="16" height="50" rx="3" transform="rotate(35)" fill="url(#woodWarm)"/>
    <polygon points="12,32 18,36 10,75 4,71" fill="#a0aab2"/>
    <polygon points="4,71 10,75 8,82 2,78" fill="#e0e6ed"/>
  </g>

  <!-- Subtle Badge: "El Yapımı & Masif Ahşap" -->
  <g transform="translate(140, 140)">
    <rect x="0" y="0" width="190" height="42" rx="21" fill="#ffffff" fill-opacity="0.9" stroke="#d4c3be" stroke-width="1"/>
    <circle cx="21" cy="21" r="9" fill="#442a22"/>
    <path d="M 18,21 L 20,23 L 25,18" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="42" y="26" font-family="sans-serif" font-size="12" font-weight="600" fill="#442a22" letter-spacing="0.5">ZANAATKAR ATÖLYESİ</text>
  </g>
</svg>
