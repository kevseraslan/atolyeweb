<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="emptyWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#825646"/>
      <stop offset="100%" stop-color="#543024"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="150" r="90" fill="#f6f2ef"/>
  
  <!-- Empty blueprint furniture draft -->
  <g transform="translate(130, 80)" stroke="#827470" stroke-width="1.5" fill="none">
    <!-- Drawing grid -->
    <line x1="0" y1="40" x2="140" y2="40" stroke-dasharray="3 3" opacity="0.4"/>
    <line x1="0" y1="80" x2="140" y2="80" stroke-dasharray="3 3" opacity="0.4"/>
    <line x1="0" y1="120" x2="140" y2="120" stroke-dasharray="3 3" opacity="0.4"/>

    <!-- Crafted stool / side table in progress -->
    <ellipse cx="70" cy="60" rx="45" ry="12" fill="#d9c5b8" stroke="#442a22" stroke-width="2"/>
    <line x1="40" y1="68" x2="30" y2="130" stroke="#442a22" stroke-width="3" stroke-linecap="round"/>
    <line x1="70" y1="72" x2="70" y2="135" stroke="#442a22" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="68" x2="110" y2="130" stroke="#442a22" stroke-width="3" stroke-linecap="round"/>
    <!-- Cross rungs -->
    <line x1="36" y1="105" x2="104" y2="105" stroke="#442a22" stroke-width="1.5"/>
  </g>

  <!-- Carpenter's pencil on drafting paper -->
  <g transform="translate(230, 180) rotate(-25)">
    <polygon points="0,0 60,0 60,8 0,8" fill="#d4af37"/>
    <polygon points="60,0 75,4 60,8" fill="#deb887"/>
    <polygon points="70,3 75,4 70,5" fill="#333333"/>
  </g>
</svg>
