<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="orderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf9"/>
      <stop offset="100%" stop-color="#f5eee8"/>
    </linearGradient>
    <filter id="shadowLight" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#442a22" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#orderGrad)"/>

  <!-- Drafting Compass, Wooden Blocks & Measure Tape -->
  <g filter="url(#shadowLight)" transform="translate(100, 70)">
    <!-- Blueprint paper -->
    <rect x="50" y="20" width="300" height="220" rx="8" fill="#ffffff" stroke="#d4c3be" stroke-width="1.5"/>
    
    <!-- Grid inside blueprint -->
    <g opacity="0.15" stroke="#442a22" stroke-width="1">
      <line x1="70" y1="60" x2="330" y2="60"/>
      <line x1="70" y1="100" x2="330" y2="100"/>
      <line x1="70" y1="140" x2="330" y2="140"/>
      <line x1="70" y1="180" x2="330" y2="180"/>
      <line x1="120" y1="30" x2="120" y2="230"/>
      <line x1="200" y1="30" x2="200" y2="230"/>
      <line x1="280" y1="30" x2="280" y2="230"/>
    </g>

    <!-- Custom Table Dimension Sketch -->
    <polygon points="120,130 280,130 300,150 100,150" fill="#eed9cc" stroke="#442a22" stroke-width="1.5"/>
    <line x1="120" y1="150" x2="115" y2="210" stroke="#442a22" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="280" y1="150" x2="285" y2="210" stroke="#442a22" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Dimension arrows (Ölçü çizgileri) -->
    <g stroke="#8d5b4c" stroke-width="1" fill="none">
      <line x1="90" y1="115" x2="310" y2="115"/>
      <polyline points="95,110 90,115 95,120"/>
      <polyline points="305,110 310,115 305,120"/>
      <line x1="80" y1="130" x2="80" y2="210"/>
      <polyline points="75,135 80,130 85,135"/>
      <polyline points="75,205 80,210 85,205"/>
    </g>

    <!-- Wooden Caliper / Ruler lying diagonally -->
    <g transform="translate(180, 160) rotate(-15)">
      <rect x="0" y="0" width="160" height="20" rx="3" fill="#8c5845"/>
      <line x1="20" y1="0" x2="20" y2="6" stroke="#ffffff" stroke-width="1"/>
      <line x1="40" y1="0" x2="40" y2="10" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="60" y1="0" x2="60" y2="6" stroke="#ffffff" stroke-width="1"/>
      <line x1="80" y1="0" x2="80" y2="10" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="100" y1="0" x2="100" y2="6" stroke="#ffffff" stroke-width="1"/>
      <line x1="120" y1="0" x2="120" y2="10" stroke="#ffffff" stroke-width="1.5"/>
      <line x1="140" y1="0" x2="140" y2="6" stroke="#ffffff" stroke-width="1"/>
    </g>
  </g>

  <!-- Step Badges -->
  <g transform="translate(180, 320)">
    <rect x="0" y="0" width="240" height="34" rx="17" fill="#ffffff" stroke="#d4c3be" stroke-width="1"/>
    <circle cx="17" cy="17" r="7" fill="#442a22"/>
    <text x="35" y="21" font-family="sans-serif" font-size="11" font-weight="600" fill="#442a22">BİREBİR ÖLÇÜ &amp; TASARIM</text>
  </g>
</svg>
