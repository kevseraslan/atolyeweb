# Furniture Workshop Production Nginx Configuration Template
# NOTE: Final domain server_name and Let's Encrypt SSL/TLS certificates will be configured in Phase 19.

server {
    listen 80;
    listen [::]:80;
    server_name _; # Placeholder: Domain will be bound in Phase 19

    # Max body size for admin image uploads (12M limit)
    client_max_body_size 12M;

    # Gzip Compression Foundation
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_comp_level 6;
    gzip_min_length 1000;

    # FastAPI Backend Reverse Proxy (/api/v1/* -> 127.0.0.1:8000)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000/api/v1/;
        proxy_http_version 1.1;

        # Forwarded Headers Sanitization
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Next.js Frontend Reverse Proxy (/ -> 127.0.0.1:3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSockets / Next HMR support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Headers Sanitization
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
